name: Autonomous Verification

on:
  pull_request:
    paths:
      - ".autodata-autonomy-policy.json"
      - "README.md"
      - ".cursor/agents/**"
      - "docs/agents/**"
      - "docs/architecture/**"
      - "docs/github/**"
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
      - "scripts/autonomy/**"
      - "apps/api-go/**"
      - "workers/**"
      - "packages/contracts/**"
      - "db/migrations/**"
      - "infra/compose/**"
      - "infra/k8s/**"
      - "scripts/dev/**"
      - "scripts/contracts/**"
      - ".github/workflows/autonomous-verification.yml"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/dev/test_repository_governance.py"
  push:
    paths:
      - ".autodata-autonomy-policy.json"
      - "README.md"
      - ".cursor/agents/**"
      - "docs/agents/**"
      - "docs/architecture/**"
      - "docs/github/**"
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
      - "scripts/autonomy/**"
      - "apps/api-go/**"
      - "workers/**"
      - "packages/contracts/**"
      - "db/migrations/**"
      - "infra/compose/**"
      - "infra/k8s/**"
      - "scripts/dev/**"
      - "scripts/contracts/**"
      - ".github/workflows/autonomous-verification.yml"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/dev/test_repository_governance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-policy:
    name: Validate autonomy policy and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/autonomy -p 'test_*.py' -v

      - name: Validate deterministic evidence fixture
        run: >-
          python scripts/autonomy/validate_run.py
          --manifest scripts/autonomy/fixtures/pass.json
          --policy .autodata-autonomy-policy.json
          --evidence-root scripts/autonomy/fixtures/evidence
          --json

      - name: Set up build-only Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pinned browser SDK and native client helpers
        run: |
          npm --prefix apps/api-go/workshop-client ci --ignore-scripts --no-audit --no-fund
          node apps/api-go/workshop-client/build.mjs --check
          node --test apps/api-go/workshop-client.test.mjs
          python -m unittest scripts/dev/test_workshop_browser_smoke.py -v

      - name: Run Go API tests
        working-directory: apps/api-go
        run: go test ./...

      - name: Validate shared contract bindings
        run: |
          python scripts/contracts/generate.py
          git diff --exit-code -- packages/contracts/go/contracts.go packages/contracts/python/autodata_contracts/contracts.py

      - name: Run shared contract tests
        run: |
          python -m pip install --disable-pip-version-check --no-input PyYAML jsonschema referencing
          python -m unittest discover -s scripts/contracts -p 'test_*.py' -v

      - name: Run Go contract tests
        working-directory: packages/contracts/go
        run: go test ./...

      - name: Run ingestion worker tests
        working-directory: workers/ingestion-python
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              dependencies = tomllib.load(project_file)["project"]["dependencies"]
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-input", *dependencies],
              check=True,
          )
          PY
          python -m pytest tests -q

      - name: Run enrichment worker tests
        working-directory: workers/enrichment-python
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run development adapter tests
        run: python -m unittest discover -s scripts/dev -p 'test_*.py' -v

      - name: Validate Compose definition
        env:
          AUTODATA_POSTGRES_PASSWORD: ci-validation-only
          AUTODATA_MINIO_ROOT_USER: ci-validation-admin
          AUTODATA_MINIO_ROOT_PASSWORD: ci-validation-only
        run: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml config --quiet

      - name: Run fake integration smoke
        env:
          AUTODATA_POSTGRES_PASSWORD: ci-validation-only
          AUTODATA_MINIO_ROOT_USER: ci-validation-admin
          AUTODATA_MINIO_ROOT_PASSWORD: ci-validation-only
        run: docker compose -f infra/compose/compose.yaml run --rm fake-integrations

      - name: Run live Compose fast-lane smoke
        env:
          AUTODATA_POSTGRES_PASSWORD: ci-validation-only
          AUTODATA_MINIO_ROOT_USER: ci-validation-admin
          AUTODATA_MINIO_ROOT_PASSWORD: ci-validation-only
        run: |
          set -eu
          cleanup() {
            exit_status=$?
            if [ "$exit_status" -ne 0 ]; then
              docker compose -f infra/compose/compose.yaml logs api || true
            fi
            docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml down --volumes --remove-orphans
            exit "$exit_status"
          }
          trap cleanup EXIT
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml up -d --wait postgres nats minio
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml run migration-runner
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml run --rm ingest-fixture
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml up -d --wait api
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml run --rm api-runtime-smoke
          docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml run --rm --no-deps ingestion-smoke

  workshop-dto-browser:
    name: Workshop DTO browser inventory (not real API acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install exact browser fixture runtime
        run: |
          python -m pip install -r scripts/dev/requirements-workshop-browser.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Exercise all 120 DTO browser cases over actual Go TLS assets
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -eu
          fixture_dir=$(mktemp -d)
          chmod 700 "$fixture_dir"
          cleanup() {
            if [ -n "${fixture_pid:-}" ]; then
              kill -TERM -- "-$fixture_pid" 2>/dev/null || true
              for attempt in $(seq 1 20); do
                if ! kill -0 "$fixture_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              kill -KILL -- "-$fixture_pid" 2>/dev/null || true
              wait "$fixture_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          setsid env AUTODATA_WORKSHOP_BROWSER_FIXTURE=1 AUTODATA_WORKSHOP_BROWSER_READY="$fixture_dir/ready.json" go -C apps/api-go test -run '^TestWorkshopBrowserFixtureHTTP$' -count=1 -timeout=75m >"$fixture_dir/go-fixture.log" 2>&1 &
          fixture_pid=$!
          python - "$fixture_dir/ready.json" "$fixture_pid" <<'PY'
          import os
          from pathlib import Path
          import sys
          import time
          ready = Path(sys.argv[1])
          pid = int(sys.argv[2])
          deadline = time.monotonic() + 120
          while not ready.exists():
              if time.monotonic() >= deadline:
                  raise SystemExit("fixture readiness timeout")
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  raise SystemExit("fixture process exited before readiness")
              time.sleep(0.1)
          PY
          fixture_origin=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["origin"])' "$fixture_dir/ready.json")
          python scripts/dev/workshop_browser_smoke.py --base-url "$fixture_origin" --mode dto-fixture --browser all --candidate-sha "$CANDIDATE_SHA" --output "$fixture_dir/browser"
