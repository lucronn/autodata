{
  "name": "Workshop production release definitions (execution blocked)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "operation": {
          "description": "Explicit operation; publish never deploys",
          "required": true,
          "type": "choice",
          "options": [
            "publish",
            "deploy",
            "staging-build-candidate",
            "staging-finalize"
          ]
        },
        "source_sha": {
          "description": "Exact reviewed source commit (40 lowercase hex)",
          "required": true,
          "type": "string"
        },
        "published_run_id": {
          "description": "Deploy only: immutable successful publish run ID",
          "required": false,
          "type": "string"
        },
        "artifact_id": {
          "description": "Deploy only: immutable published artifact ID",
          "required": false,
          "type": "string"
        },
        "artifact_digest": {
          "description": "Deploy only: sha256 digest of published artifact bytes",
          "required": false,
          "type": "string"
        },
        "manifest_sha256": {
          "description": "Deploy only: exact reviewed release manifest digest",
          "required": false,
          "type": "string"
        },
        "candidate_digest": {
          "description": "Staging finalize only: independently approved immutable candidate OCI reference",
          "required": false,
          "type": "string"
        },
        "candidate_run_id": {
          "description": "Staging finalize only: successful candidate run ID",
          "required": false,
          "type": "string"
        },
        "candidate_run_attempt": {
          "description": "Staging finalize only: exact candidate upload attempt",
          "required": false,
          "type": "string"
        },
        "approval_record_sha256": {
          "description": "Staging finalize only: independently signed approval record SHA256",
          "required": false,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "workshop-production-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "name": "publish definition (live adapter unavailable)",
      "if": "${{ vars.WORKSHOP_PUBLISH_ENABLED == 'true' && github.repository == 'lucronn/autodata' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' }}",
      "runs-on": "ubuntu-24.04",
      "environment": "workshop-production-publish",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 45,
      "env": {
        "EVENT_NAME": "${{ github.event_name }}",
        "REPOSITORY": "${{ github.repository }}",
        "REPOSITORY_ID": "${{ github.repository_id }}",
        "REPOSITORY_OWNER_ID": "${{ github.repository_owner_id }}",
        "EXPECTED_REPOSITORY_ID": "${{ vars.WORKSHOP_REPOSITORY_ID }}",
        "EXPECTED_OWNER_ID": "${{ vars.WORKSHOP_OWNER_ID }}",
        "REF": "${{ github.ref }}",
        "WORKFLOW_REF": "${{ github.workflow_ref }}",
        "OPERATION": "publish",
        "SOURCE_SHA": "${{ inputs.source_sha }}",
        "CONFIG_SHA256": "${{ vars.WORKSHOP_CONFIG_SHA256 }}",
        "WIF_PROVIDER": "${{ vars.WORKSHOP_PUBLISH_WIF_PROVIDER }}",
        "SERVICE_ACCOUNT": "${{ vars.WORKSHOP_PUBLISH_SERVICE_ACCOUNT }}",
        "PUBLISH_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_PUBLISH_SERVICE_ACCOUNT }}",
        "DEPLOY_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_DEPLOY_SERVICE_ACCOUNT }}",
        "BACKUP_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_BACKUP_SERVICE_ACCOUNT }}",
        "MONITOR_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_MONITOR_SERVICE_ACCOUNT }}",
        "OTHER_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_DEPLOY_SERVICE_ACCOUNT }}",
        "PUBLISHED_RUN_ID": "${{ inputs.published_run_id }}",
        "ARTIFACT_ID": "${{ inputs.artifact_id }}",
        "ARTIFACT_DIGEST": "${{ inputs.artifact_digest }}",
        "MANIFEST_SHA256": "${{ inputs.manifest_sha256 }}"
      },
      "steps": [
        {
          "id": "validate",
          "name": "Validate fixed authority and immutable inputs",
          "shell": "bash",
          "run": "python3 -I - <<'PYVALIDATE'\nimport os\nimport re\nimport sys\nimport uuid\n\ndef require(condition):\n    if not condition:\n        # Never echo inputs, claims, principal details, credentials or exceptions.\n        sys.stderr.write('invalid_input: Workshop workflow dispatch rejected\\n')\n        raise SystemExit(2)\n\ndef matches(name, pattern):\n    return re.fullmatch(pattern, os.environ.get(name, '')) is not None\n\noperation = os.environ.get('OPERATION', '')\nrequire(operation == 'publish')\nrequire(os.environ.get('EVENT_NAME') in ['workflow_dispatch'])\nrequire(os.environ.get('REPOSITORY') == 'lucronn/autodata')\nrequire(os.environ.get('REF') == 'refs/heads/master')\nrequire(os.environ.get('WORKFLOW_REF') == 'lucronn/autodata/.github/workflows/release-workshop.yml@refs/heads/master')\nfor actual, expected in [('REPOSITORY_ID', 'EXPECTED_REPOSITORY_ID'), ('REPOSITORY_OWNER_ID', 'EXPECTED_OWNER_ID')]:\n    require(matches(expected, r'[1-9][0-9]{0,19}'))\n    require(os.environ.get(actual) == os.environ.get(expected))\nrequire(matches('SOURCE_SHA', r'[0-9a-f]{40}'))\nrequire(matches('CONFIG_SHA256', r'[0-9a-f]{64}'))\nrequire(matches('WIF_PROVIDER', r'projects/[1-9][0-9]*/locations/global/workloadIdentityPools/[a-z][a-z0-9-]{3,62}/providers/[a-z][a-z0-9-]{3,62}'))\nrequire(matches('SERVICE_ACCOUNT', r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nprincipal_names = ('PUBLISH_SERVICE_ACCOUNT', 'DEPLOY_SERVICE_ACCOUNT', 'BACKUP_SERVICE_ACCOUNT', 'MONITOR_SERVICE_ACCOUNT')\nfor name in principal_names:\n    require(matches(name, r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nrequire(len({os.environ[name] for name in principal_names}) == 4)\nrequire(os.environ['SERVICE_ACCOUNT'] == os.environ[operation.upper() + '_SERVICE_ACCOUNT'])\nrequire(matches('OTHER_SERVICE_ACCOUNT', r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nrequire(os.environ['SERVICE_ACCOUNT'] != os.environ['OTHER_SERVICE_ACCOUNT'])\nfor name in ('PUBLISHED_RUN_ID', 'ARTIFACT_ID', 'ARTIFACT_DIGEST', 'MANIFEST_SHA256'):\n    require(not os.environ.get(name))\n# This validates input shape and protected configuration only. It does not\n# authenticate OIDC, fetch an artifact, prove provenance or perform an operation.\nsys.stdout.write('Workshop definition inputs validated; execution remains blocked\\n')\nPYVALIDATE"
        },
        {
          "name": "Block until separately reviewed live capability exists",
          "shell": "bash",
          "run": "printf '%s\\n' 'missing_dependency: reviewed WIF and immutable publish adapter required' >&2\nexit 3"
        }
      ]
    },
    "deploy": {
      "name": "deploy definition (live adapter unavailable)",
      "if": "${{ vars.WORKSHOP_DEPLOY_ENABLED == 'true' && github.repository == 'lucronn/autodata' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' }}",
      "runs-on": "ubuntu-24.04",
      "environment": "workshop-production-deploy",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 30,
      "env": {
        "EVENT_NAME": "${{ github.event_name }}",
        "REPOSITORY": "${{ github.repository }}",
        "REPOSITORY_ID": "${{ github.repository_id }}",
        "REPOSITORY_OWNER_ID": "${{ github.repository_owner_id }}",
        "EXPECTED_REPOSITORY_ID": "${{ vars.WORKSHOP_REPOSITORY_ID }}",
        "EXPECTED_OWNER_ID": "${{ vars.WORKSHOP_OWNER_ID }}",
        "REF": "${{ github.ref }}",
        "WORKFLOW_REF": "${{ github.workflow_ref }}",
        "OPERATION": "deploy",
        "SOURCE_SHA": "${{ inputs.source_sha }}",
        "CONFIG_SHA256": "${{ vars.WORKSHOP_CONFIG_SHA256 }}",
        "WIF_PROVIDER": "${{ vars.WORKSHOP_DEPLOY_WIF_PROVIDER }}",
        "SERVICE_ACCOUNT": "${{ vars.WORKSHOP_DEPLOY_SERVICE_ACCOUNT }}",
        "PUBLISH_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_PUBLISH_SERVICE_ACCOUNT }}",
        "DEPLOY_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_DEPLOY_SERVICE_ACCOUNT }}",
        "BACKUP_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_BACKUP_SERVICE_ACCOUNT }}",
        "MONITOR_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_MONITOR_SERVICE_ACCOUNT }}",
        "OTHER_SERVICE_ACCOUNT": "${{ vars.WORKSHOP_PUBLISH_SERVICE_ACCOUNT }}",
        "PUBLISHED_RUN_ID": "${{ inputs.published_run_id }}",
        "ARTIFACT_ID": "${{ inputs.artifact_id }}",
        "ARTIFACT_DIGEST": "${{ inputs.artifact_digest }}",
        "MANIFEST_SHA256": "${{ inputs.manifest_sha256 }}"
      },
      "steps": [
        {
          "id": "validate",
          "name": "Validate fixed authority and immutable inputs",
          "shell": "bash",
          "run": "python3 -I - <<'PYVALIDATE'\nimport os\nimport re\nimport sys\nimport uuid\n\ndef require(condition):\n    if not condition:\n        # Never echo inputs, claims, principal details, credentials or exceptions.\n        sys.stderr.write('invalid_input: Workshop workflow dispatch rejected\\n')\n        raise SystemExit(2)\n\ndef matches(name, pattern):\n    return re.fullmatch(pattern, os.environ.get(name, '')) is not None\n\noperation = os.environ.get('OPERATION', '')\nrequire(operation == 'deploy')\nrequire(os.environ.get('EVENT_NAME') in ['workflow_dispatch'])\nrequire(os.environ.get('REPOSITORY') == 'lucronn/autodata')\nrequire(os.environ.get('REF') == 'refs/heads/master')\nrequire(os.environ.get('WORKFLOW_REF') == 'lucronn/autodata/.github/workflows/release-workshop.yml@refs/heads/master')\nfor actual, expected in [('REPOSITORY_ID', 'EXPECTED_REPOSITORY_ID'), ('REPOSITORY_OWNER_ID', 'EXPECTED_OWNER_ID')]:\n    require(matches(expected, r'[1-9][0-9]{0,19}'))\n    require(os.environ.get(actual) == os.environ.get(expected))\nrequire(matches('SOURCE_SHA', r'[0-9a-f]{40}'))\nrequire(matches('CONFIG_SHA256', r'[0-9a-f]{64}'))\nrequire(matches('WIF_PROVIDER', r'projects/[1-9][0-9]*/locations/global/workloadIdentityPools/[a-z][a-z0-9-]{3,62}/providers/[a-z][a-z0-9-]{3,62}'))\nrequire(matches('SERVICE_ACCOUNT', r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nprincipal_names = ('PUBLISH_SERVICE_ACCOUNT', 'DEPLOY_SERVICE_ACCOUNT', 'BACKUP_SERVICE_ACCOUNT', 'MONITOR_SERVICE_ACCOUNT')\nfor name in principal_names:\n    require(matches(name, r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nrequire(len({os.environ[name] for name in principal_names}) == 4)\nrequire(os.environ['SERVICE_ACCOUNT'] == os.environ[operation.upper() + '_SERVICE_ACCOUNT'])\nrequire(matches('OTHER_SERVICE_ACCOUNT', r'[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\\.iam\\.gserviceaccount\\.com'))\nrequire(os.environ['SERVICE_ACCOUNT'] != os.environ['OTHER_SERVICE_ACCOUNT'])\nfor name in ('PUBLISHED_RUN_ID', 'ARTIFACT_ID'):\n    require(matches(name, r'[1-9][0-9]{0,19}'))\nrequire(matches('ARTIFACT_DIGEST', r'sha256:[0-9a-f]{64}'))\nrequire(matches('MANIFEST_SHA256', r'[0-9a-f]{64}'))\n# This validates input shape and protected configuration only. It does not\n# authenticate OIDC, fetch an artifact, prove provenance or perform an operation.\nsys.stdout.write('Workshop definition inputs validated; execution remains blocked\\n')\nPYVALIDATE"
        },
        {
          "name": "Block until separately reviewed live capability exists",
          "shell": "bash",
          "run": "printf '%s\\n' 'missing_dependency: reviewed WIF and immutable published-run/artifact/digest verification adapter required' >&2\nexit 3"
        }
      ]
    },
    "staging-build-candidate": {
      "name": "staging-build-candidate (owner-installed authenticated publisher)",
      "if": "${{ vars.WORKSHOP_STAGING_PUBLISH_ENABLED == 'true' && github.repository == 'lucronn/autodata' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.operation == 'staging-build-candidate' }}",
      "runs-on": [
        "self-hosted",
        "linux",
        "x64",
        "workshop-staging-publisher"
      ],
      "environment": "workshop-staging-publish",
      "permissions": {
        "contents": "read",
        "actions": "read",
        "id-token": "write"
      },
      "timeout-minutes": 125,
      "env": {
        "EVENT_NAME": "${{ github.event_name }}",
        "REPOSITORY": "${{ github.repository }}",
        "REPOSITORY_ID": "${{ github.repository_id }}",
        "REPOSITORY_OWNER_ID": "${{ github.repository_owner_id }}",
        "EXPECTED_REPOSITORY_ID": "${{ vars.WORKSHOP_REPOSITORY_ID }}",
        "EXPECTED_OWNER_ID": "${{ vars.WORKSHOP_OWNER_ID }}",
        "REF": "${{ github.ref }}",
        "WORKFLOW_REF": "${{ github.workflow_ref }}",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}",
        "RUN_ID": "${{ github.run_id }}",
        "RUN_ATTEMPT": "${{ github.run_attempt }}",
        "OPERATION": "staging-build-candidate",
        "SOURCE_SHA": "${{ inputs.source_sha }}",
        "CONFIG_SHA256": "${{ vars.WORKSHOP_STAGING_CONFIG_SHA256 }}",
        "ACTIVATION_SHA256": "${{ vars.WORKSHOP_STAGING_ACTIVATION_SHA256 }}",
        "TOOLCHAIN_SHA256": "${{ vars.WORKSHOP_STAGING_TOOLCHAIN_SHA256 }}",
        "TRUST_POLICY_SHA256": "${{ vars.WORKSHOP_STAGING_TRUST_POLICY_SHA256 }}",
        "CANDIDATE_DIGEST": "${{ inputs.candidate_digest }}",
        "CANDIDATE_RUN_ID": "${{ inputs.candidate_run_id }}",
        "CANDIDATE_RUN_ATTEMPT": "${{ inputs.candidate_run_attempt }}",
        "APPROVAL_RECORD_SHA256": "${{ inputs.approval_record_sha256 }}",
        "TOOLCHAIN_IMAGE": "${{ vars.WORKSHOP_STAGING_TOOLCHAIN_IMAGE }}"
      },
      "steps": [
        {
          "id": "validate",
          "name": "Validate nonsecret staging identity and phase inputs",
          "shell": "bash",
          "run": "python3 -I - <<'PYVALIDATE'\nimport os\nimport re\nimport sys\n\ndef require(condition):\n    if not condition:\n        sys.stderr.write('invalid_input: Workshop staging dispatch rejected\\n')\n        raise SystemExit(2)\n\ndef matches(name, pattern):\n    return re.fullmatch(pattern, os.environ.get(name, '')) is not None\n\nrequire(os.environ.get('EVENT_NAME') == 'workflow_dispatch')\nrequire(os.environ.get('REPOSITORY') == 'lucronn/autodata')\nrequire(os.environ.get('REF') == 'refs/heads/master')\nrequire(os.environ.get('WORKFLOW_REF') == 'lucronn/autodata/.github/workflows/release-workshop.yml@refs/heads/master')\nrequire(os.environ.get('OPERATION') == 'staging-build-candidate')\nfor actual, expected in [('REPOSITORY_ID', 'EXPECTED_REPOSITORY_ID'), ('REPOSITORY_OWNER_ID', 'EXPECTED_OWNER_ID')]:\n    require(matches(expected, r'[1-9][0-9]{0,19}'))\n    require(os.environ.get(actual) == os.environ.get(expected))\nfor name in ('SOURCE_SHA', 'WORKFLOW_SHA'):\n    require(matches(name, r'[0-9a-f]{40}'))\nfor name in ('CONFIG_SHA256', 'ACTIVATION_SHA256', 'TOOLCHAIN_SHA256', 'TRUST_POLICY_SHA256'):\n    require(matches(name, r'[0-9a-f]{64}'))\nrequire(matches('RUN_ID', r'[1-9][0-9]{0,19}'))\nrequire(matches('RUN_ATTEMPT', r'[1-9][0-9]{0,3}'))\nrequire(int(os.environ['RUN_ATTEMPT']) <= 1000)\nfinalize = os.environ['OPERATION'] == 'staging-finalize'\nif finalize:\n    require(matches('CANDIDATE_DIGEST', r'[a-z0-9-]+-docker\\.pkg\\.dev/[a-z][a-z0-9-]{4,61}[a-z0-9]/[a-z][a-z0-9._-]*/candidate@sha256:[0-9a-f]{64}'))\n    require(matches('CANDIDATE_RUN_ID', r'[1-9][0-9]{0,19}'))\n    require(matches('CANDIDATE_RUN_ATTEMPT', r'[1-9][0-9]{0,3}'))\n    require(int(os.environ['CANDIDATE_RUN_ATTEMPT']) <= 1000)\n    require(matches('APPROVAL_RECORD_SHA256', r'[0-9a-f]{64}'))\nelse:\n    for name in ('CANDIDATE_DIGEST', 'CANDIDATE_RUN_ID', 'CANDIDATE_RUN_ATTEMPT', 'APPROVAL_RECORD_SHA256'):\n        require(not os.environ.get(name))\n# Shape only. Runtime identity, approval signature, owner policy and tool pins\n# must be authenticated by separately activated reviewed control code.\nsys.stdout.write('Workshop staging inputs validated; installed authority required\\n')\nPYVALIDATE"
        },
        {
          "name": "Checkout reviewed control at exact workflow SHA",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "control",
            "persist-credentials": false,
            "fetch-depth": 1,
            "submodules": false,
            "lfs": false
          }
        },
        {
          "name": "Authenticate installed policy and execute bounded staging publisher",
          "uses": "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "with": {
            "github-token": "${{ github.token }}",
            "script": "const fs = require('node:fs/promises');\nconst path = require('node:path');\nconst crypto = require('node:crypto');\nconst {spawn} = require('node:child_process');\nconst requireValue = value => { if (!value) throw Error('missing_dependency: owner-installed staging publisher prerequisites required'); };\nconst sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');\nconst canonical = value => Array.isArray(value) ? '['+value.map(canonical).join(',')+']' : value !== null && typeof value === 'object' ? '{'+Object.keys(value).sort().map(key=>JSON.stringify(key)+':'+canonical(value[key])).join(',')+'}' : JSON.stringify(value);\n// IAM service-account tokens are requested for one hour. Keep the whole\n// exchange/publish sequence inside45 minutes and reserve five more for cleanup;\n// a static Docker auth entry must never be used for a two-hour Buildx session.\nfunction credentialWindow(startedAt,now=performance.now()) {\n  const remaining=startedAt+45*60*1000-now;\n  requireValue(Number.isFinite(startedAt)&&Number.isFinite(now)&&now>=startedAt&&remaining>30000);\n  return Math.floor(remaining);\n}\nlet root, containerSequence=0, credentialCleanupDeadline, builderOwner, builderLock;\nconst ownedContainers = new Set();\nasync function run(argv, {input, env={}, timeout=300000, maximum=1048576}={}) {\n  requireValue(Array.isArray(argv) && argv.every(value=>typeof value==='string'));\n  return await new Promise((resolve,reject)=>{\n    const child=spawn(argv[0],argv.slice(1),{shell:false,detached:true,env:{PATH:'/usr/local/bin:/usr/bin:/bin',HOME:root??'/nonexistent',...env},stdio:['pipe','pipe','pipe']});\n    let failure=false,size=0,errors=0,closed=false,kill;\n    const chunks=[];\n    const stop=()=>{if(failure)return;failure=true;try{process.kill(-child.pid,'SIGTERM');}catch{}kill=setTimeout(()=>{try{process.kill(-child.pid,'SIGKILL');}catch{}},2000);};\n    const timer=setTimeout(stop,timeout);\n    child.stdout.on('data',chunk=>{size+=chunk.length;if(size>maximum)stop();else chunks.push(chunk);});\n    child.stderr.on('data',chunk=>{errors+=chunk.length;if(errors>65536)stop();});\n    child.on('error',stop);child.stdin.on('error',stop);\n    child.on('close',code=>{closed=true;clearTimeout(timer);clearTimeout(kill);if(failure||code!==0)reject(Error('operation_failed: bounded staging publisher process failed'));else resolve(Buffer.concat(chunks));});\n    child.stdin.end(input);\n  });\n}\nasync function fixedFile(directory,name,maximum=1048576) {\n  const file=path.join(directory,name),before=await fs.lstat(file);\n  requireValue(before.isFile() && !before.isSymbolicLink() && before.nlink===1 && before.uid===0 && before.size>0 && before.size<=maximum && !(before.mode&0o022));\n  const handle=await fs.open(file,require('node:fs').constants.O_RDONLY|require('node:fs').constants.O_NOFOLLOW);\n  try {const stat=await handle.stat();requireValue(stat.ino===before.ino && stat.dev===before.dev && stat.size===before.size);return await handle.readFile();}finally{await handle.close();}\n}\nasync function write(name,bytes) {await fs.writeFile(name,bytes,{mode:0o600,flag:'wx'});}\nasync function docker(args,options={}) {return run(['/usr/bin/docker',...args],options);}\n// BEGIN OWNED BUILDER CLEANUP\nasync function exactBuilderResource(kind,name,remaining) {\n  const filter=kind==='container'?'name=^/'+name+'$':'name=^'+name+'$';\n  const args=kind==='container'?['container','ls','--all','--quiet','--no-trunc','--filter',filter]:['volume','ls','--quiet','--filter',filter];\n  const names=(await docker(args,{timeout:remaining()})).toString().trim().split('\\n').filter(Boolean);\n  requireValue(names.length<=1);return names[0];\n}\nasync function cleanupOwnedBuilder(owner,remaining) {\n  requireValue(owner.protocol_version===1 && /^[0-9a-f]{64}$/.test(owner.context_sha256) && /^workshop-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$/.test(owner.builder_name));\n  requireValue(owner.container_name==='buildx_buildkit_'+owner.builder_name+'0' && /^[0-9a-f]{64}$/.test(owner.owner_nonce) && /^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$/.test(owner.buildkit_image));\n  const id=await exactBuilderResource('container',owner.container_name,remaining);\n  if(id){\n    requireValue(/^[0-9a-f]{64}$/.test(id));\n    const values=JSON.parse((await docker(['container','inspect',id],{timeout:remaining()})).toString());\n    requireValue(values.length===1);const value=values[0];\n    requireValue(value.Id===id && value.Name==='/'+owner.container_name && value.Config.Image===owner.buildkit_image);\n    const nonces=value.Config.Env.filter(entry=>entry.startsWith('AUTODATA_PUBLISHER_OWNER='));\n    requireValue(nonces.length===1 && nonces[0]==='AUTODATA_PUBLISHER_OWNER='+owner.owner_nonce);\n    // Never remove by the reusable global name: mutate only this proven ID.\n    await docker(['container','rm','--force',id],{timeout:remaining()});\n  }\n  requireValue(!(await exactBuilderResource('container',owner.container_name,remaining)));\n  const volume=owner.container_name+'_state';\n  if(await exactBuilderResource('volume',volume,remaining)){\n    const values=JSON.parse((await docker(['volume','inspect',volume],{timeout:remaining()})).toString());\n    requireValue(values.length===1 && values[0].Name===volume && values[0].Labels?.['autodata.publisher.owner']===owner.owner_nonce);\n    await docker(['volume','rm',volume],{timeout:remaining()});\n  }\n  requireValue(!(await exactBuilderResource('volume',volume,remaining)));\n}\n// END OWNED BUILDER CLEANUP\nlet image, mounts;\nasync function container(entrypoint,args,input,env={},timeout=300000) {\n  const cidfile=path.join(root,'container-'+(++containerSequence)+'.cid');\n  try {return await docker(['run','--pull=never','--rm','--read-only','--init','--cap-drop=ALL','--security-opt=no-new-privileges','--pids-limit=512','--memory=8g','--cpus=4','--cidfile',cidfile,'--workdir','/run/autodata-publisher','--tmpfs','/tmp:rw,nosuid,nodev,mode=1777',...