name: autodata

services:
  postgres:
    image: ${AUTODATA_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
    ports:
      - "${AUTODATA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: ${AUTODATA_NATS_IMAGE:-nats:2.10-alpine}
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${AUTODATA_NATS_PORT:-4222}:4222"
      - "${AUTODATA_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: ${AUTODATA_MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AUTODATA_MINIO_ROOT_USER:?set AUTODATA_MINIO_ROOT_USER for local development}
      MINIO_ROOT_PASSWORD: ${AUTODATA_MINIO_ROOT_PASSWORD:?set AUTODATA_MINIO_ROOT_PASSWORD for local development}
    ports:
      - "${AUTODATA_S3_PORT:-9000}:9000"
      - "${AUTODATA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: apps/api-go/Dockerfile
    environment:
      AUTODATA_API_ADDR: ":8080"
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_PROJECTION_STORE: "postgres"
      AUTODATA_NATS_ADDRESS: "nats:4222"
      AUTODATA_S3_ADDRESS: "minio:9000"
    ports:
      - "${AUTODATA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  ingestion-worker:
    build:
      context: ../..
      dockerfile: workers/ingestion-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_NATS_ADDRESS: "nats:4222"
      AUTODATA_NATS_URL: "nats://nats:4222"
      AUTODATA_S3_ADDRESS: "minio:9000"
      AUTODATA_EMBEDDING_MODE: ${AUTODATA_EMBEDDING_MODE:-deterministic-fake}
      AUTODATA_SOURCE_PERSIST: ${AUTODATA_SOURCE_PERSIST:-0}
      AUTODATA_FAST_CONSUMER_ENABLED: ${AUTODATA_FAST_CONSUMER_ENABLED:-0}
      AUTODATA_FAST_CONSUMER_DURABLE: ${AUTODATA_FAST_CONSUMER_DURABLE:-autodata-fast-lane}
      AUTODATA_FAST_CONSUMER_MAX_DELIVERIES: ${AUTODATA_FAST_CONSUMER_MAX_DELIVERIES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from autodata_ingestion.worker import run_once; assert run_once()['status'] == 'idle'"]

  payment-reconciler:
    build:
      context: ../..
      dockerfile: workers/ingestion-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_PAYMENT_RECONCILE_POLL_SECONDS: ${AUTODATA_PAYMENT_RECONCILE_POLL_SECONDS:-15}
      AUTODATA_PAYMENT_RECONCILE_BATCH_SIZE: ${AUTODATA_PAYMENT_RECONCILE_BATCH_SIZE:-50}
    command: ["python", "/app/scripts/reconcile_payments.py"]
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully

  enrichment-worker:
    build:
      context: ../..
      dockerfile: workers/enrichment-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_NATS_ADDRESS: "nats:4222"
      AUTODATA_S3_ADDRESS: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from autodata_enrichment.worker import run_once; assert run_once()['status'] == 'idle'"]

  outbox-relay:
    build:
      context: ../..
      dockerfile: workers/enrichment-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_NATS_URL: "nats://nats:4222"
      AUTODATA_EMBEDDING_MODE: ${AUTODATA_EMBEDDING_MODE:-deterministic-fake}
      AUTODATA_OUTBOX_BATCH_SIZE: ${AUTODATA_OUTBOX_BATCH_SIZE:-50}
      AUTODATA_OUTBOX_MAX_ATTEMPTS: ${AUTODATA_OUTBOX_MAX_ATTEMPTS:-3}
      AUTODATA_OUTBOX_POLL_SECONDS: ${AUTODATA_OUTBOX_POLL_SECONDS:-5}
    command: ["python", "/app/scripts/outbox_relay.py"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully

  fake-integrations:
    image: ${AUTODATA_PYTHON_IMAGE:-python:3.14-slim}
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    environment:
      AUTODATA_FAKE_PAYMENT_SIGNING_SECRET: local-fixture-signing-key
    command: ["python", "scripts/dev/fake_integrations_smoke.py"]

  ingest-fixture:
    build:
      context: ../..
      dockerfile: workers/ingestion-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_NATS_URL: "nats://nats:4222"
      AUTODATA_S3_ENDPOINT: "minio:9000"
      AUTODATA_S3_ACCESS_KEY: ${AUTODATA_MINIO_ROOT_USER:?set AUTODATA_MINIO_ROOT_USER for local development}
      AUTODATA_S3_SECRET_KEY: ${AUTODATA_MINIO_ROOT_PASSWORD:?set AUTODATA_MINIO_ROOT_PASSWORD for local development}
      AUTODATA_SOURCE_BUCKET: "autodata-sources"
      AUTODATA_FAKE_PAYMENT_SIGNING_SECRET: local-fixture-signing-key
    command: ["python", "-m", "autodata_ingestion.ingest_fixture"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully

  ingestion-smoke:
    build:
      context: ../..
      dockerfile: workers/ingestion-python/Dockerfile
    environment:
      AUTODATA_DB_ADDRESS: "postgres:5432"
      AUTODATA_POSTGRES_DB: ${AUTODATA_POSTGRES_DB:-autodata}
      AUTODATA_POSTGRES_USER: ${AUTODATA_POSTGRES_USER:-autodata}
      AUTODATA_POSTGRES_PASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
      AUTODATA_NATS_URL: "nats://nats:4222"
      AUTODATA_S3_ENDPOINT: "minio:9000"
      AUTODATA_S3_ACCESS_KEY: ${AUTODATA_MINIO_ROOT_USER:?set AUTODATA_MINIO_ROOT_USER for local development}
      AUTODATA_S3_SECRET_KEY: ${AUTODATA_MINIO_ROOT_PASSWORD:?set AUTODATA_MINIO_ROOT_PASSWORD for local development}
      AUTODATA_SOURCE_BUCKET: "autodata-sources"
      AUTODATA_FAKE_PAYMENT_SIGNING_SECRET: local-fixture-signing-key
    command: ["python", "/app/scripts/ingestion_smoke.py"]
    depends_on:
      ingest-fixture:
        condition: service_completed_successfully

  migration-runner:
    image: ${AUTODATA_POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${AUTODATA_POSTGRES_DB:-autodata}
      PGUSER: ${AUTODATA_POSTGRES_USER:-autodata}
      PGPASSWORD: ${AUTODATA_POSTGRES_PASSWORD:?set AUTODATA_POSTGRES_PASSWORD for local development}
    command: ["sh", "-c", "set -eu; for migration in /workspace/db/migrations/[0-9][0-9][0-9]_*.sql; do echo applying $${migration}; psql --set ON_ERROR_STOP=1 --file $${migration}; done"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  nats-data:
  minio-data:
