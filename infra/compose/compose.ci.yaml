services:
  # GitHub-hosted runners cannot pull the local MinIO image from Quay. Keep the
  # developer stack untouched and use a public S3-compatible implementation
  # only for the ephemeral CI fast lane.
  minio:
    image: docker.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.port=9000"]
    environment:
      AWS_ACCESS_KEY_ID: ${AUTODATA_MINIO_ROOT_USER:?set AUTODATA_MINIO_ROOT_USER for local development}
      AWS_SECRET_ACCESS_KEY: ${AUTODATA_MINIO_ROOT_PASSWORD:?set AUTODATA_MINIO_ROOT_PASSWORD for local development}
      S3_BUCKET: autodata-sources
    ports: !reset []
    volumes:
      - seaweedfs-ci-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  seaweedfs-ci-data:
