# Install only as /etc/systemd/system/docker.service.d/autodata.conf.
# Guard activity alone is insufficient: check both actual tables at every start.
[Unit]
Requires=var-lib-autodata.mount autodata-metadata-guard.service
After=var-lib-autodata.mount autodata-metadata-guard.service

[Service]
ExecStartPre=/usr/bin/env -i /usr/bin/python3 -I /opt/autodata/bin/runtime-check.py guard
