# Base44 preview entry point.
#
# The AutoData consumer interface (/workshop/) and the administrative dashboard
# (/dashboard/) are served by the Go API, which is the single origin for the
# browser client (relative /v1/... requests, Bearer header auth, no CORS).
# This proxy exists only so the preview (host port 3000) reaches that origin
# and so "/" lands on the consumer interface instead of the API's 404.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Re-resolve the API container name at request time so a recreated container
  # (compose up after a code or secret change) never leaves a stale upstream IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    location = / {
      return 302 /workshop/;
    }

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Chat progress is streamed; do not buffer it.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      client_max_body_size 64m;
    }
  }
}
