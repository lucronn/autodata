        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/config:
    get:
      tags:
      - Customer identity
      operationId: getCustomerAuthConfig
      summary: Read public sign-in configuration
      security: []
      responses:
        '200':
          description: Public Firebase configuration or explicit unavailable local
            mode.
          headers:
            Cache-Control: &id001
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthConfig'
  /auth/session:
    get:
      tags:
      - Customer identity
      operationId: getCustomerSession
      summary: Read current session and CSRF token
      security:
      - customerSession: []
      responses:
        '200':
          description: Current PostgreSQL session and live Firebase user verified.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSession'
        '401': &id002
          description: Missing, invalid, expired, revoked or deleted identity. Definite
            denial clears the cookie.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403': &id003
          description: Account blocked or Origin/CSRF rejected.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503': &id004
          description: Authentication dependency unavailable; retryable, no stale
            acceptance. Cookie retained on dependency outage. Local exchange returns
            login_available=false and retryable=false.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /auth/firebase/session:
    post:
      tags:
      - Customer identity
      operationId: exchangeFirebaseSession
      summary: Exchange a fresh Firebase Google token for a durable opaque session
      security: []
      responses:
        '204':
          description: Account and new session committed; any presented old session
            revoked atomically.
          headers:
            Cache-Control: *id001
            Set-Cookie:
              schema:
                type: string
              description: Opaque secure cookie is set only after database commit;
                logout expires it.
        '401': *id002
        '403': *id003
        '503': *id004
        '400':
          description: Invalid JSON or unknown fields.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '413':
          description: Body exceeds 32 KiB.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '415':
          description: Content-Type must be application/json.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      parameters:
      - &id005
        name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Must exactly match configured public origin; cross-site Fetch
          Metadata is rejected.
      - name: X-Autodata-Session-Exchange
        in: header
        required: true
        schema:
          type: string
        description: Must be 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseSessionExchange'
  /auth/logout:
    post:
      tags:
      - Customer identity
      operationId: logoutCustomerSession
      summary: Revoke the current session across replicas
      security:
      - customerSession: []
      responses:
        '204':
          description: Session revocation committed. Firebase availability is not
            required for logout.
          headers:
            Cache-Control: *id001
            Set-Cookie:
              schema:
                type: string
              description: Opaque secure cookie is set only after database commit;
                logout expires it.
        '401': *id002
        '403': *id003
        '503': *id004
      parameters:
      - *id005
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Session-bound token returned by GET /auth/session.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Explicit local headless fixtures only. Rejected in Firebase customer
        mode.
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-autodata_session
      description: Opaque session, Secure; HttpOnly; SameSite=Lax; Path=/; no Domain.
        Absolute expiry 12 hours; revocable across replicas. No raw Firebase token
        stored. State-changing requests require exact Origin and X-CSRF-Token from
        GET /auth/session.
  parameters:
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: string
    ArticleId:
      name: article_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CatalogImage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        image_id:
          type: string
        url:
          type: string
          pattern: ^/v1/catalog/images/[^?]+$
        alt:
          type: string
        media_type:
          enum:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
          - image/svg+xml
        status:
          enum:
          - available
          - unavailable
          - localized
        unavailable_reason:
          type: string
        asset_id:
          type: string
        caption:
          type: string
      description: Localized image metadata; storage keys are deliberately not part of this schema.
    CatalogArticle:
      type: object
      additionalProperties: false
      required:
      - id
      - vehicle_id
      - title
      - content_status
      - complete
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        title:
          type: string
        kind:
          type: string
        component:
          type: string
        body:
          type: string
        canonical_article_id:
          type: string
          minLength: 1
          nullable: true
        source_revision_id:
          type: string
          minLength: 1
          nullable: true
        canonical_revision_id:
          type: string
          minLength: 1
          nullable: true
        view_revision:
          type: string
          minLength: 1
          nullable: true
        content_status:
          enum:
          - list_only
          - content_partial
          - content_complete
        complete:
          type: boolean
        content_origin:
          enum:
          - source
          - canonical
          nullable: true
        availability:
          enum:
          - available
          - pending
          - unavailable
        review_status:
          enum:
          - UNREVIEWED
          - APPROVED
          - REJECTED
          nullable: true
        processing:
          type: object
          additionalProperties: false
          required:
          - job_id
          - state
          - retryable
          - retry_after_seconds
          - error_code
          - updated_at
          properties:
            job_id:
              type: string
              minLength: 1
            state:
              $ref: '#/components/schemas/CatalogProcessingState'
            retryable:
              type: boolean
            retry_after_seconds:
              type: integer
              minimum: 1
              nullable: true
            error_code:
              enum:
              - CATALOG_SOURCE_UNAVAILABLE
              - CATALOG_REWRITE_UNAVAILABLE
              - CATALOG_REWRITE_REJECTED
              - CATALOG_REVIEW_REQUIRED
              nullable: true
            updated_at:
              type: string
              format: date-time
          nullable: true
        document:
          oneOf:
          - $ref: '#/components/schemas/CatalogDocument'
          - nullable: true
        images:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              image_id:
                type: string
              url:
                type: string
                pattern: ^/v1/catalog/images/[^?]+$
              alt:
                type: string
              media_type:
                enum:
                - image/png
                - image/jpeg
                - image/gif
                - image/webp
                - image/svg+xml
              status:
                enum:
                - available
                - unavailable
                - localized
              unavailable_reason:
                type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instructions
            properties:
              number:
                type: integer
                minimum: 1
                description: Explicit source step number, when present. Canonical
                  document traversal does not fabricate numbers.
              heading:
                type: string
              instructions:
                type: array
                items:
                  type: string
              image_ids:
                type: array
                items:
                  type: string
              text:
                type: string
              evidence_ids:
                type: array
                items:
                  type: string
              action:
                type: string
              images:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImage'
        provenance:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            properties:
              id:
                type: string
              version:
                type: string
        source_review:
          type: object
          additionalProperties: false
          required:
          - available
          properties:
            available:
              type: boolean
            snapshot_id:
              type: string
            version:
              type: string
            content_sha256:
              type: string
            format:
              type: string
            url:
              type: string
              pattern: ^/v1/catalog/vehicles/[^?]+/articles/[^?]+/source(?:\?source_revision_id=[^&]+)?$
    CatalogArticleResponse:
      type: object
      required:
      - version
      - article
      properties:
        version:
          type: string
          enum:
          - v1
        article:
          $ref: '#/components/schemas/CatalogArticle'
    CatalogArticlesResponse:
      type: object
      required:
      - version
      - items
      properties:
        version:
          type: string
          example: v1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogArticle'
    SourceContentResponse:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceReview'
        content:
          type: string
        document:
          $ref: '#/components/schemas/CatalogDocument'
        images:
          type: array
          items:
            $ref: '#/components/schemas/CatalogImage'
        view_revision:
          type: string
          nullable: true
    SourceReview:
      type: object
      properties:
        available:
          type: boolean
        snapshot_id:
          type: string
        version:
          type: string
        content_sha256:
          type: string
        format:
          type: string
          enum:
          - html
          - json
        url:
          type: string
    CatalogDocument:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - normalization_version
      - blocks
      properties:
        schema_version:
          enum:
          - 1
        normalization_version:
          enum:
          - ordered-article-v1
        blocks:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - type
            properties:
              block_id:
                type: string
              type:
                type: string
              text:
                type: string
              label:
                type: string
              alt:
                type: string
              status:
                type: string
              unavailable_reason:
                type: string
              asset_id:
                type: string
              image_id:
                type: string
              source_locator:
                type: string
              source_order:
                type: integer
              level:
                type: integer
              number:
                type: integer
              columns:
                type: array
                items:
                  type: string
              items:
                type: array
                items:
                  type: string
              evidence_ids:
                type: array
                items:
                  type: string
              rows:
                type: array
                items:
                  type: array
                  items:
                    oneOf:
                    - type: string
                    - type: number
                    - nullable: true
                    - type: object
                      additionalProperties: false
                      properties:
                        text:
                          type: string
                        asset_id:
                          type: string
                        image_id:
                          type: string
                        status:
                          type: string
                        unavailable_reason:
                          type: string
                        evidence_ids:
                          type: array
                          items:
                            type: string
                        images:
                          type: array
                          items:
                            $ref: '#/components/schemas/CatalogImage'
              caption:
                type: string
              images:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImage'
    CatalogProcessingState:
      type: string
      enum:
      - queued
      - fetching_source
      - normalizing
      - rewriting
      - validating
      - publishing
      - completed
      - failed
      - needs_review
    CatalogContentOrigin:
      type: string
      enum:
      - source
      - canonical
    CatalogReviewStatus:
      type: string
      enum:
      - UNREVIEWED
      - APPROVED
      - REJECTED
    APIError:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - FORBIDDEN
              - INVALID_REQUEST
              - CATALOG_NOT_FOUND
              - CATALOG_WITHDRAWN
              - CATALOG_SCHEDULING_UNAVAILABLE
              - CATALOG_SOURCE_UNAVAILABLE
              - CATALOG_UNAVAILABLE
              - CATALOG_REVIEW_REQUIRED
              - CATALOG_PROCESSING_FAILED
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: false
              properties:
                article_id:
                  type: string
                job_id:
                  type: string
                retry_after_seconds:
                  type: integer
                  minimum: 1
    FirebaseWebConfig:
      type: object
      additionalProperties: false
      required:
      - apiKey
      - authDomain
      - projectId
      - appId
      properties:
        apiKey:
          type: string
        authDomain:
          type: string
        projectId:
          type: string
        appId:
          type: string
    CustomerAuthConfig:
      type: object
      additionalProperties: false
      required:
      - version
      - mode
      - login_available
      - providers
      properties:
        version:
          type: string
          enum:
          - v1
        mode:
          type: string
          enum:
          - firebase
          - local
        login_available:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum:
            - google.com
        firebase:
          $ref: '#/components/schemas/FirebaseWebConfig'
      description: Public web configuration only. Local mode returns login_available=false,
        providers=[] and omits firebase; it creates no demo identity.
    CustomerSession:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - roles
      - expires_at
      - csrf_token
      properties:
        authenticated:
          type: boolean
          enum:
          - true
        roles:
          type: array
          items:
            type: string
            enum:
            - dataset_viewer
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
      description: No project, UID, token hash, account identifier or raw provider
        payload is exposed.
    FirebaseSessionExchange:
      type: object
      additionalProperties: false
      required:
      - id_token
      properties:
        id_token:
          type: string
          writeOnly: true
      description: Fresh Google Firebase ID token with iat/auth_time within 5 minutes,
        at most 60 seconds future skew. Signature, issuer, audience, provider, expiry
        and live user state are verified. SDK revocation uses iat; application additionally
        compares auth_time. The same still-fresh token may be exchanged again.
  responses:
    Unauthorized:
      description: Authentication is required.
    Forbidden:
      description: The caller lacks the required role.
    NotFound:
      description: Article or source snapshot not found.
    Unavailable:
      description: Catalog temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    Conflict:
      description: Known article requires review or processing has stopped.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    Gone:
      description: Known authorized article has been withdrawn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    InvalidRequest:
      description: Selector or request shape is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    RateLimited:
      description: Admission limit; respect Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
