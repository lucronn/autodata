        '409':
          $ref: '#/components/responses/Conflict'
      description: Read one authorized immutable source or canonical projection. A
        cold known descriptor schedules bounded durable work. Repeated reads join
        its job. Readable source returns 200 throughout rewriting and on terminal
        rewrite failure. complete means validated canonical publication.
  /v1/catalog/vehicles/{vehicle_id}/articles/{article_id}/source:
    get:
      tags:
      - Catalog media
      operationId: getStoredArticleSource
      summary: Read sanitized stored source content
      description: Read the authorized immutable ordered source document without provider,
        model or scheduling calls. Sanitized compatibility content and local media
        retain unavailable placeholders.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/ArticleId'
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/json
          - text/html
      - name: source_revision_id
        in: query
        required: false
        schema:
          type: string
        description: Pins an immutable revision belonging to this authorized article
          and vehicle.
      responses:
        '200':
          description: Sanitized stored source in the requested representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContentResponse'
            text/html:
              schema:
                type: string
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/catalog/images/{token}:
    get:
      tags:
      - Catalog media
      operationId: getLocalizedCatalogImage
      summary: Fetch an AutoData-localized image
      description: The token is randomly minted by AutoData and resolves only to a
        validated local object key. It is not a provider URL or storage key. No bearer
        token is required; invalid or unavailable references fail closed. Tokens are
        environment-specific and must not be constructed from this document.
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 6000
      responses:
        '200':
          description: Localized image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Invalid reference, missing local object, or invalid media.
          content:
            text/plain:
              schema:
                type: string
                example: catalog image not found
        '503':
          description: Image key or local object storage is unavailable.
          content:
            text/plain:
              schema:
                type: string
                example: catalog image storage is unavailable
  /v1/catalog/images:
    get:
      tags:
      - Catalog media
      operationId: rejectLegacyCatalogImageReference
      summary: Reject the legacy source-bearing image route
      description: The src query parameter is not accepted; the handler never fetches
        caller-supplied URLs.
      deprecated: true
      security: []
      responses:
        '400':
          description: An opaque image path token is required.
          content:
            text/plain:
              schema:
                type: string
                example: opaque image reference required
