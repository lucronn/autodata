openapi: 3.0.3
info:
  title: AutoData Catalog API
  version: 1.0.0
  description: Provider-neutral public selector metadata and purchased configuration
    catalog. Firebase Google customers use an opaque secure session cookie and a current
    exact configuration/region grant for every protected read. Paid GETs are observational;
    explicit CSRF-protected preparation reuses durable source and canonical jobs.
    Explicit local headless fixtures retain their injected bearer/legacy behavior.
servers:
- url: /
security:
- customerSession: []
- bearerAuth: []
tags:
- name: Catalog media
- name: Customer identity
- name: Workshop commerce
paths:
  /v1/catalog/vehicles/{vehicle_id}/articles:
    get:
      tags:
      - Catalog media
      operationId: listCatalogArticles
      summary: List purchased configuration article descriptors
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
        description: Optional assertion of the selected configuration region; it must
          match exactly.
      responses:
        '200':
          description: Metadata-only canonical descriptors and safe current progress;
            images is always an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogArticlesResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      description: In Firebase mode vehicle_id is the exact canonical configuration
        UUID, not a base vehicle UUID. A verified session and current owner/configuration/region
        grant precede descriptor/progress reads. GET never schedules an index or article
        job. Only canonical identities are returned; document, body, steps and image
        URLs are omitted.
  /v1/catalog/vehicles/{vehicle_id}/articles/{article_id}:
    get:
      tags:
      - Catalog media
      operationId: getCatalogArticle
      summary: Read a catalog article and its opaque image URLs
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/ArticleId'
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
        description: Optional assertion of the selected configuration region; it must
          match exactly.
      responses:
