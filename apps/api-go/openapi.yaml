  /v1/catalog/vehicles/{vehicle_id}/articles/{article_id}/prepare:
    post:
      tags:
      - Catalog media
      operationId: preparePaidCatalogArticle
      summary: Explicitly prepare a purchased canonical article
      responses:
        '200':
          description: Current readable source or canonical article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogArticleResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '202':
          description: Actual durable article processing observed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogArticleResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          description: Malformed/nonempty JSON or trailing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '413':
          description: Body exceeds2KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      description: Firebase customer mode only. Require current verified session,
        exact configured Origin, session-bound X-CSRF-Token, exact purchased configuration
        and canonical article eligibility; recheck current grant immediately before
        durable ensure. The body must be exactly an empty JSON object, at most2KiB.
        Concurrent requests and separately entitled owners reuse the same durable
        article job. Return the actual reread lifecycle view:202 only with observed
        durable processing,200 for readable source/canonical,409/410 for current lifecycle/rights,503
        without durable acknowledgement. No client provider, model, source URI or
        idempotency key is accepted.
      security:
      - customerSession: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/ArticleId'
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Exact configured application origin.
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Session-bound token from GET /auth/session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Explicit local headless fixtures only. Rejected in Firebase customer
        mode.
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-autodata_session
      description: Opaque session, Secure; HttpOnly; SameSite=Lax; Path=/; no Domain.
        Absolute expiry 12 hours; revocable across replicas. No raw Firebase token
        stored. State-changing requests require exact Origin and X-CSRF-Token from
        GET /auth/session.
  parameters:
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: string
      description: Firebase paid routes require the exact canonical configuration
        UUID returned by selectors. Base vehicle IDs are not aliases. Explicit local
        fixtures retain legacy vehicle IDs.
    ArticleId:
      name: article_id
      in: path
      required: true
      schema:
        type: string
      description: Canonical article UUID returned by the exact configuration descriptor
        list; unmanaged legacy IDs are rejected in Firebase mode.
  schemas:
    CatalogImage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        image_id:
          type: string
        url:
          type: string
          pattern: ^/v1/catalog/images/[^?]+$
        alt:
          type: string
        media_type:
          enum:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
          - image/svg+xml
        status:
          enum:
          - available
          - unavailable
          - localized
        unavailable_reason:
          type: string
        asset_id:
          type: string
        caption:
          type: string
      description: Localized image metadata; storage keys are deliberately not part of this schema.
    CatalogArticle:
      type: object
      additionalProperties: false
      required:
      - id
      - vehicle_id
      - title
      - content_status
      - complete
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        title:
          type: string
        kind:
          type: string
        component:
          type: string
        body:
          type: string
        canonical_article_id:
          type: string
          minLength: 1
          nullable: true
        source_revision_id:
          type: string
          minLength: 1
          nullable: true
        canonical_revision_id:
          type: string
          minLength: 1
          nullable: true
        view_revision:
          type: string
          minLength: 1
          nullable: true
        content_status:
          enum:
          - list_only
          - content_partial
          - content_complete
        complete:
          type: boolean
        content_origin:
          enum:
          - source
          - canonical
          nullable: true
        availability:
          enum:
          - available
          - pending
          - unavailable
        review_status:
          enum:
          - UNREVIEWED
          - APPROVED
          - REJECTED
          nullable: true
        processing:
          type: object
          additionalProperties: false
          required:
          - job_id
          - state
          - retryable
          - retry_after_seconds
          - error_code
          - updated_at
          properties:
            job_id:
              type: string
              minLength: 1
            state:
              $ref: '#/components/schemas/CatalogProcessingState'
            retryable:
              type: boolean
            retry_after_seconds:
              type: integer
              minimum: 1
              nullable: true
            error_code:
              enum:
              - CATALOG_SOURCE_UNAVAILABLE
              - CATALOG_REWRITE_UNAVAILABLE
              - CATALOG_REWRITE_REJECTED
              - CATALOG_REVIEW_REQUIRED
              nullable: true
            updated_at:
              type: string
              format: date-time
          nullable: true
        document:
          oneOf:
          - $ref: '#/components/schemas/CatalogDocument'
          - nullable: true
        images:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              image_id:
                type: string
              url:
                type: string
                pattern: ^/v1/catalog/images/[^?]+$
              alt:
                type: string
              media_type:
                enum:
                - image/png
                - image/jpeg
                - image/gif
                - image/webp
                - image/svg+xml
              status:
                enum:
                - available
                - unavailable
                - localized
              unavailable_reason:
                type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - instructions
            properties:
              number:
                type: integer
                minimum: 1
                description: Explicit source step number, when present. Canonical
                  document traversal does not fabricate numbers.
              heading:
                type: string
              instructions:
                type: array
                items:
                  type: string
              image_ids:
                type: array
                items:
                  type: string
              text:
                type: string
              evidence_ids:
                type: array
                items:
                  type: string
              action:
                type: string
              images:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImage'
        provenance:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            properties:
              id:
                type: string
              version:
                type: string
        source_review:
          type: object
          additionalProperties: false
          required:
          - available
          properties:
            available:
              type: boolean
            snapshot_id:
              type: string
            version:
              type: string
            content_sha256:
              type: string
            format:
              type: string
            url:
              type: string
              pattern: ^/v1/catalog/vehicles/[^?]+/articles/[^?]+/source(?:\?source_revision_id=[^&]+)?$
    CatalogArticleResponse:
      type: object
      required:
      - version
      - article
      properties:
        version:
          type: string
          enum:
          - v1
        article:
          $ref: '#/components/schemas/CatalogArticle'
    CatalogArticlesResponse:
      type: object
      required:
      - version
      - items
      properties:
        version:
          type: string
          example: v1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogArticle'
    SourceContentResponse:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceReview'
        content:
          type: string
        document:
          $ref: '#/components/schemas/CatalogDocument'
        images:
          type: array
          items:
            $ref: '#/components/schemas/CatalogImage'
        view_revision:
          type: string
          nullable: true
    SourceReview:
      type: object
      properties:
        available:
          type: boolean
        snapshot_id:
          type: string
        version:
          type: string
        content_sha256:
          type: string
        format:
          type: string
          enum:
          - html
          - json
        url:
          type: string
    CatalogDocument:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - normalization_version
      - blocks
      properties:
        schema_version:
          enum:
          - 1
        normalization_version:
          enum:
          - ordered-article-v1
        blocks:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - type
            properties:
              block_id:
                type: string
              type:
                type: string
              text:
                type: string
              label:
                type: string
              alt:
                type: string
              status:
                type: string
              unavailable_reason:
                type: string
              asset_id:
                type: string
              image_id:
                type: string
              source_locator:
                type: string
              source_order:
                type: integer
              level:
                type: integer
              number:
                type: integer
              columns:
                type: array
                items:
                  type: string
              items:
                type: array
                items:
                  type: string
              evidence_ids:
                type: array
                items:
                  type: string
              rows:
                type: array
                items:
                  type: array
                  items:
                    oneOf:
                    - type: string
                    - type: number
                    - nullable: true
                    - type: object
                      additionalProperties: false
                      properties:
                        text:
                          type: string
                        asset_id:
                          type: string
                        image_id:
                          type: string
                        status:
                          type: string
                        unavailable_reason:
                          type: string
                        evidence_ids:
                          type: array
                          items:
                            type: string
                        images:
                          type: array
                          items:
                            $ref: '#/components/schemas/CatalogImage'
              caption:
                type: string
              images:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImage'
    CatalogProcessingState:
      type: string
      enum:
      - queued
      - fetching_source
      - normalizing
      - rewriting
      - validating
      - publishing
      - completed
      - failed
      - needs_review
    CatalogContentOrigin:
      type: string
      enum:
      - source
      - canonical
    CatalogReviewStatus:
      type: string
      enum:
      - UNREVIEWED
      - APPROVED
      - REJECTED
    APIError:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - FORBIDDEN
              - INVALID_REQUEST
              - CATALOG_NOT_FOUND
              - CATALOG_WITHDRAWN
              - CATALOG_SCHEDULING_UNAVAILABLE
              - CATALOG_SOURCE_UNAVAILABLE
              - CATALOG_UNAVAILABLE
              - CATALOG_REVIEW_REQUIRED
              - CATALOG_PROCESSING_FAILED
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: false
              properties:
                article_id:
                  type: string
                job_id:
                  type: string
                retry_after_seconds:
                  type: integer
                  minimum: 1
    FirebaseWebConfig:
      type: object
      additionalProperties: false
      required:
      - apiKey
      - authDomain
      - projectId
      - appId
      properties:
        apiKey:
          type: string
        authDomain:
          type: string
        projectId:
          type: string
        appId:
          type: string
    CustomerAuthConfig:
      type: object
      additionalProperties: false
      required:
      - version
      - mode
      - login_available
      - providers
      properties:
        version:
          type: string
          enum:
          - v1
        mode:
          type: string
          enum:
          - firebase
          - local
        login_available:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum:
            - google.com
        firebase:
          $ref: '#/components/schemas/FirebaseWebConfig'
      description: Public web configuration only. Local mode returns login_available=false,
        providers=[] and omits firebase; it creates no demo identity.
    CustomerSession:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - roles
      - expires_at
      - csrf_token
      properties:
        authenticated:
          type: boolean
          enum:
          - true
        roles:
          type: array
          items:
            type: string
            enum:
            - dataset_viewer
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
      description: No project, UID, token hash, account identifier or raw provider
        payload is exposed.
    FirebaseSessionExchange:
      type: object
      additionalProperties: false
      required:
      - id_token
      properties:
        id_token:
          type: string
          writeOnly: true
      description: Fresh Google Firebase ID token with iat/auth_time within 5 minutes,
        at most 60 seconds future skew. Signature, issuer, audience, provider, expiry
        and live user state are verified. SDK revocation uses iat; application additionally
        compares auth_time. The same still-fresh token may be exchanged again.
    WorkshopQuote:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        product_key:
          type: string
          enum:
          - workshop-configuration-v1
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        configuration_label:
          type: string
          maxLength: 1024
        amount_minor:
          type: integer
          format: int64
          enum:
          - 2000
        currency:
          type: string
          enum:
          - USD
        purchase_terms_version:
          type: string
          enum:
          - workshop-v1
        purchasable:
          type: boolean
          enum:
          - true
      required:
      - version
      - product_key
      - configuration_id
      - region
      - configuration_label
      - amount_minor
      - currency
      - purchase_terms_version
      - purchasable
    WorkshopCheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        terms_version:
          type: string
          enum:
          - workshop-v1
      required:
      - configuration_id
      - region
      - terms_version
    WorkshopCheckout:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        order_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        state:
          type: string
          enum:
          - checkout
        checkout_url:
          type: string
          format: uri
          pattern: ^https://checkout[.]stripe[.]com/c/pay/
          description: Exact validated Stripe-hosted HTTPS URL, including its opaque
            provider fragment when present.
        provider_expires_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
      required:
      - version
      - order_id
      - configuration_id
      - region
      - state
      - checkout_url
      - provider_expires_at
    WorkshopProcessing:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        order_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        state:
          type: string
          enum:
          - processing
      required:
      - version
      - order_id
      - configuration_id
      - region
      - state
    WorkshopOwned:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        order_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        state:
          type: string
          enum:
          - owned
        library_item_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      required:
      - version
      - order_id
      - configuration_id
      - region
      - state
      - library_item_id
    WorkshopCheckoutResponse:
      oneOf:
      - $ref: '#/components/schemas/WorkshopCheckout'
      - $ref: '#/components/schemas/WorkshopProcessing'
      - $ref: '#/components/schemas/WorkshopOwned'
      discriminator:
        propertyName: state
        mapping:
          checkout: '#/components/schemas/WorkshopCheckout'
          processing: '#/components/schemas/WorkshopProcessing'
          owned: '#/components/schemas/WorkshopOwned'
    WorkshopOrder:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        order_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        state:
          type: string
          enum:
          - creating
          - open
          - processing
          - paid
          - expired
          - canceled
          - reconciliation_required
          - revoked
        retry_disposition:
          type: string
          enum:
          - new_key
          - do_not_repay
          description: Only remotely confirmed expired/canceled orders permit a new
            key. Browser return parameters never establish payment.
      required:
      - version
      - order_id
      - configuration_id
      - region
      - state
      - retry_disposition
    WorkshopLibraryItem:
      type: object
      additionalProperties: false
      properties:
        library_item_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        configuration_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        region:
          type: string
          pattern: ^[A-Z]{2}$
        label:
          type: string
          maxLength: 1024
        access_state:
          type: string
          enum:
          - paid
          - preparing
          - viewable
          - revoked
        granted_at:
          type: string
          format: date-time
          description: Actual RFC3339 UTC grant time. Null only for a revoked order
            that never received an entitlement; no synthetic grant time.
          nullable: true
        revoked_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        dataset_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        content_error_code:
          type: string
          enum:
          - CATALOG_PREPARATION_UNAVAILABLE
          - CATALOG_PREPARATION_REVIEW
          - CATALOG_SOURCE_UNAVAILABLE
      required:
      - library_item_id
      - configuration_id
      - region
      - label
      - access_state
      - granted_at
      description: Permanent account ownership with current source readiness. No normal
        grant expiry. Revoked tombstones remain visible; viewable does not promise
        all articles are complete.
      oneOf:
      - properties:
          access_state:
            type: string
            enum:
            - revoked
        required:
        - access_state
      - properties:
          access_state:
            type: string
            enum:
            - paid
            - preparing
            - viewable
          granted_at:
            type: string
            format: date-time
            nullable: false
        required:
        - access_state
        - granted_at
    WorkshopLibrary:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - v1
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/WorkshopLibraryItem'
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
      required:
      - version
      - items
      - next_cursor
    StripeWebhookDisposition:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - accepted
          - pending
          - quarantined
          - ignored
      required:
      - status
    CommerceAPIError:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - FORBIDDEN
              - AUTHENTICATION_UNAVAILABLE
              - INVALID_REQUEST
              - COMMERCE_UNAVAILABLE
              - NOT_FOUND
              - CONFIGURATION_NOT_FOUND
              - ORDER_NOT_FOUND
              - CUSTOMER_ACCESS_REQUIRED
              - ENTITLEMENT_REQUIRED
              - ENTITLEMENT_REVOKED
              - IDEMPOTENCY_CONFLICT
              - TERMS_VERSION_REQUIRED
              - PAYMENT_FINANCIAL_CONFLICT
              - PAYMENT_EVENT_CONFLICT
              - PAYMENT_MODE_CONFLICT
              - REQUEST_TOO_LARGE
              - INVALID_STRIPE_SIGNATURE
              - INVALID_CURSOR
              - INVALID_PAYMENT_EVENT
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: false
              properties:
                article_id:
                  type: string
                job_id:
                  type: string
                retry_after_seconds:
                  type: integer
                  minimum: 1
  responses:
    Unauthorized:
      description: Authentication is required.
    Forbidden:
      description: The caller lacks the required role.
    NotFound:
      description: Article or source snapshot not found.
    Unavailable:
      description: Catalog temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    Conflict:
      description: Known article requires review or processing has stopped.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    Gone:
      description: Known authorized article has been withdrawn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    InvalidRequest:
      description: Selector or request shape is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
    RateLimited:
      description: Admission limit; respect Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          schema:
            type: string
            example: private, no-store
