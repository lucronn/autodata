openapi: 3.0.3
info:
  title: AutoData Catalog API
  version: 1.0.0
  description: Provider-neutral selector cascade, descriptor index, ordered source/canonical
    lifecycle, immutable source review and localized media. Firebase Google customer
    sessions use an opaque secure cookie; explicit local headless mode retains fixture
    bearer authentication. Firebase mode rejects Authorization headers. Paid catalog
    access is separately gated.
servers:
- url: /
security:
- customerSession: []
- bearerAuth: []
tags:
- name: Catalog media
- name: Customer identity
paths:
  /v1/catalog/vehicles/{vehicle_id}/articles:
    get:
      tags:
      - Catalog media
      operationId: listCatalogArticles
      summary: List a vehicle's catalog articles and opaque image URLs
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Catalog article list. Missing or unlocalized images have no
            display URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogArticlesResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/catalog/vehicles/{vehicle_id}/articles/{article_id}:
    get:
      tags:
      - Catalog media
      operationId: getCatalogArticle
      summary: Read a catalog article and its opaque image URLs
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Normalized article; internal object keys and provider URLs
            are omitted.
