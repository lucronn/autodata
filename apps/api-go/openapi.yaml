        '409':
          $ref: '#/components/responses/Conflict'
      description: 'Read the currently permitted immutable source or canonical projection
        after current session, exact configuration grant and canonical article membership
        checks. Firebase GET never schedules work: a cold descriptor without readable
        content or durable processing returns503 CATALOG_SOURCE_UNAVAILABLE. POST
        prepare explicitly starts or joins durable processing. Readable source returns200
        while rewriting; complete means validated canonical publication. Explicit
        local fixtures retain legacy lazy GET preparation.'
  /v1/catalog/vehicles/{vehicle_id}/articles/{article_id}/source:
    get:
      tags:
      - Catalog media
      operationId: getStoredArticleSource
      summary: Read sanitized stored source content
      description: Read the permitted ordered source HTML or JSON after current session
        and exact purchased configuration grant. source_revision_id may select a historical
        revision of this article, while current membership, source rights and quarantine
        still apply. Embedded media uses authenticated short-lived contextual references.
        No provider, model or scheduling call occurs.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/ArticleId'
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/json
          - text/html
      - name: source_revision_id
        in: query
        required: false
        schema:
          type: string
        description: Pins an immutable revision belonging to this authorized article
          and vehicle.
      - name: region
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
        description: Optional assertion of the selected configuration region; it must
          match exactly.
      responses:
        '200':
          description: Sanitized stored source in the requested representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContentResponse'
            text/html:
              schema:
                type: string
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/catalog/images/{token}:
    get:
      tags:
      - Catalog media
      operationId: getLocalizedCatalogImage
      summary: Fetch an AutoData-localized image
      description: 'In Firebase mode require the current customer session and a valid
        v2 contextual media reference. A reference is not an authorization credential:
        current exact grant, owner, configuration, article/provider identity, current
        revision anchors, selected source, asset mapping and rights are rechecked
        before S3. References expire after300 seconds; refresh the authorized article/source
        projection to renew. No v1/key-only fallback. Invalid/context-obsolete references404;
        expired/revoked session401; grant denial403; current withdrawal410; dependency
        outage503. Explicit injected local fixtures retain their legacy v1 behavior.'
      security:
      - customerSession: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: ^v2\.[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 6000
      responses:
        '200':
          description: Localized image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '404':
          description: Invalid reference, missing local object, or invalid media.
          content:
            text/plain:
              schema:
                type: string
                example: catalog image not found
        '503':
          description: Image key or local object storage is unavailable.
          content:
            text/plain:
              schema:
                type: string
                example: catalog image storage is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/catalog/images:
    get:
      tags:
      - Catalog media
      operationId: rejectLegacyCatalogImageReference
      summary: Reject the legacy source-bearing image route
      description: 'In Firebase mode require the current customer session and a valid
        v2 contextual media reference. A reference is not an authorization credential:
        current exact grant, owner, configuration, article/provider identity, current
        revision anchors, selected source, asset mapping and rights are rechecked
        before S3. References expire after300 seconds; refresh the authorized article/source
        projection to renew. No v1/key-only fallback. Invalid/context-obsolete references404;
        expired/revoked session401; grant denial403; current withdrawal410; dependency
        outage503. Explicit injected local fixtures retain their legacy v1 behavior.'
      deprecated: true
      security:
      - customerSession: []
      responses:
        '400':
          description: An opaque image path token is required.
          content:
            text/plain:
              schema:
                type: string
                example: opaque image reference required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
