<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>AutoData vehicle selector</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">AutoData</p>
        <h1>Choose a vehicle</h1>
        <p id="instructions">Start with a decade, then choose a year and make.</p>
      </header>

      <p id="status" class="status" role="status">Loading vehicles…</p>

      <section class="selector-grid" aria-label="Vehicle selector">
        <section class="step" aria-labelledby="decade-title">
          <h2 id="decade-title">1. Decade</h2>
          <div id="decade-list" class="choice-list" aria-live="polite"></div>
        </section>

        <section class="step" id="year-step" aria-labelledby="year-title" hidden>
          <h2 id="year-title">2. Year</h2>
          <div id="year-list" class="choice-list" aria-live="polite"></div>
        </section>

        <section class="step" id="make-step" aria-labelledby="make-title" hidden>
          <h2 id="make-title">3. Make</h2>
          <div id="make-letter-list" class="choice-list make-letters" aria-live="polite"></div>
          <div id="make-list" class="choice-list" aria-live="polite" hidden></div>
        </section>
      </section>

      <section id="selected-vehicle" class="selected" aria-live="polite" hidden>
        <p class="eyebrow">Selected vehicle</p>
        <strong id="selected-label">—</strong>
        <button id="continue-button" class="continue-button" type="button" disabled>
          Continue to repair request
        </button>
      </section>
    </main>
    <script src="/dashboard/app.js?v=vehicle-selector-v1" defer></script>
  </body>
</html>
