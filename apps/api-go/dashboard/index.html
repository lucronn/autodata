<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>AutoData vehicle selector</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">AutoData</p>
        <h1>Choose a vehicle</h1>
        <p id="instructions">Choose a decade, then keep selecting in the same row.</p>
      </header>

      <p id="status" class="status" role="status">Loading vehicles…</p>

      <section class="selector-grid" aria-label="Vehicle selector">
        <section class="step" aria-labelledby="step-title">
          <h2 id="step-title">1. Decade</h2>
          <div id="choice-row" class="choice-row" aria-live="polite">
            <div id="decade-step" class="choice-pane">
              <div id="decade-list" class="choice-list"></div>
            </div>
            <div id="year-step" class="choice-pane" hidden>
              <div id="year-list" class="choice-list"></div>
            </div>
            <div id="make-step" class="choice-pane" hidden>
              <div id="make-letter-list" class="choice-list make-letters"></div>
              <div id="make-list" class="choice-list" hidden></div>
            </div>
            <div id="model-step" class="choice-pane" hidden>
              <div id="model-list" class="choice-list"></div>
            </div>
            <div id="configuration-step" class="choice-pane" hidden>
              <div id="configuration-list" class="choice-list"></div>
            </div>
          </div>
        </section>
      </section>

      <section id="selected-vehicle" class="selected" aria-live="polite" hidden>
        <p class="eyebrow">Selected vehicle</p>
        <strong id="selected-label">—</strong>
        <button id="continue-button" class="continue-button" type="button" disabled>
          Continue to repair request
        </button>
      </section>
    </main>
    <script src="/dashboard/app.js?v=vehicle-selector-v2" defer></script>
  </body>
</html>
