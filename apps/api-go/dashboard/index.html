<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f1eb" />
    <title>AutoData — Catalog</title>
    <style>
      :root { color-scheme: light; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; color: #1e2929; background: #f2f1eb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      main { width: min(720px, 100%); border: 1px solid #9da9a2; background: #faf9f4; box-shadow: 8px 8px 0 #d9ded7; padding: clamp(24px, 6vw, 56px); }
      .eyebrow { color: #3656df; font: 600 12px/1.4 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(38px, 8vw, 68px); line-height: .98; letter-spacing: -.065em; }
      p { max-width: 48ch; color: #56615c; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { display: inline-block; border: 1px solid #1e2929; padding: 12px 16px; color: #1e2929; text-decoration: none; transition: transform .15s ease, background .15s ease; }
      a:first-child { color: white; border-color: #244ce5; background: #244ce5; }
      a:hover { transform: translateY(-2px); }
      code { font: 13px ui-monospace, monospace; color: #3656df; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AutoData / Catalog service</div>
      <h1>Find the procedure.<br />Get to work.</h1>
      <p>Browse vehicle-matched service information through the Workshop, inspect the API contract, or start an integration from the catalog endpoint.</p>
      <nav aria-label="AutoData destinations">
        <a href="/workshop/">Open Workshop ↗</a>
        <a href="/swagger/">Explore API ↗</a>
        <a href="/v1/catalog/years">Browse API catalog ↗</a>
      </nav>
      <p><small>Catalog API: <code>GET /v1/catalog/years</code></small></p>
    </main>
  </body>
</html>
